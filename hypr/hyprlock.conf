auth {
  fingerprint {
    enabled = true
  }
}

general {
  hide_cursor = true
  ignore_empty_input = true
}

animations {
  enabled = false
}

background {
  monitor = 
  path = $HOME/.config/hypr/Wallpapers/landscape.jpg

  blur_passes = 2 
  blur_size = 2
  noise = 0.05
}

label {
  monitor = 
  text = $TIME
  color = rgba(200, 200, 200, 1.0)
  font_size = 80
  font_family = Cousine

  position = 0, 0
  halign = center
  valign = center
}
